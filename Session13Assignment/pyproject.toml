[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glc_v3"
version = "3.0.0"
description = "Session 13: Live Task Graph, 7-Drawer Memory, Semantic Chunking V2, and A2A Protocol Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.4.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
glc = "glc_v3.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
